<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Álbum - Libro Abierto</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <link rel="stylesheet" href="mi-album.css">
</head>
<body>

    <a href="index.html" class="btn-volver">← Volver</a>
    <div class="titulo-album">📖 MI ÁLBUM ABIERTO 📖</div>

    <div id="book-container">
        <div id="book">
            <div class="page page-cover">
                <div style="font-size:50px">🏆</div>
                <div style="margin-top:10px">FIFA 2026</div>
                <div style="font-size:12px; margin-top:8px; opacity:0.9">Toca las esquinas para pasar página</div>
            </div>
            <div class="page">
                <h3>Página 1 - Jugadores</h3>
                <div class="grid" id="grid1"></div>
            </div>
            <div class="page">
                <h3>Página 2 - Jugadores</h3>
                <div class="grid" id="grid2"></div>
            </div>
            <div class="page">
                <h3>Página 3 - Equipos</h3>
                <div class="grid" id="grid3"></div>
            </div>
            <div class="page">
                <h3>Página 4 - Equipos</h3>
                <div class="grid" id="grid4"></div>
            </div>
            <div class="page page-cover">
                <div style="font-size:40px">⭐</div>
                <div style="margin-top:10px">FIN</div>
                <div style="font-size:11px; margin-top:8px; opacity:0.9">Contraportada</div>
            </div>
        </div>
    </div>

    <button id="btnSobre">📦 Abrir Sobre</button>

    <div id="sobreScreen">
        <div class="sobre-titulo">SOBRE DE DELUXE PACK</div>
        <div class="sobre-sub">Toca el sobre para abrirlo</div>
        <div class="envelope" id="envelope">
            <div class="env-body">
                <div class="copa">🏆</div>
                <div class="txt">FIFA 2026</div>
                <div class="panini">PANINI</div>
            </div>
            <div class="env-flap"></div>
        </div>
        <div id="bandeja"></div>
        <button id="btnCerrar">Pegar en mi álbum</button>
    </div>

    <script src="mi-album.js"></script>

</body>
</html>
